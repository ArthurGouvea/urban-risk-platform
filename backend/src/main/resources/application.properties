spring.application.name=urbanrisk
server.port=8080

# ---------- Banco (H2 em memória para desenvolvimento/demonstração) ----------
spring.datasource.url=jdbc:h2:mem:urbanriskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------- Disponibilidade / observabilidade ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------- Simulador de sensores IoT ----------
urbanrisk.simulador.habilitado=true
urbanrisk.simulador.intervalo-ms=4000
# probabilidade, por sensor e por ciclo, de iniciar um episódio de risco
urbanrisk.simulador.probabilidade-evento=0.02

# ---------- IA ----------
# intervalo de reavaliação dos alertas ativos (recência + novas correlações)
urbanrisk.reavaliacao.intervalo-ms=30000

# ---------- LGPD ----------
# salt usado na pseudonimização (SHA-256). Em produção, defina via variável de ambiente URBANRISK_LGPD_SALT.
urbanrisk.lgpd.salt=${URBANRISK_LGPD_SALT:troque-este-salt-em-producao}

# ---------- Segurança ----------
# token exigido para ações de agente/operador e boletins de base pública (cabeçalho X-Token-Agente)
urbanrisk.seguranca.token-agente=${URBANRISK_TOKEN_AGENTE:defesa-civil-2026}
