# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbanrisk}
spring.datasource.username=${DB_USER:urbanrisk}
spring.datasource.password=${DB_PASSWORD:urbanrisk}
spring.datasource.driverClassName=org.postgresql.Driver
spring.h2.console.enabled=false
